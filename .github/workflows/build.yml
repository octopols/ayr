name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Warnings are errors, so a clean compile is the lint step.
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -InformationalVersion "0.0.0-ci+${{ github.sha }}"

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: ayr-${{ github.sha }}
          path: |
            bin/Ayr.exe
            bin/ayrctl.exe
          if-no-files-found: error
