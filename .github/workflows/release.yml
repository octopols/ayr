name: Release

# Push a tag such as v0.1.0 to build that version and publish it as a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got ${{ github.ref_name }}" }
          "number=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Version ${{ steps.version.outputs.number }}

      - name: Package
        shell: pwsh
        run: |
          $zip = "Ayr-${{ steps.version.outputs.number }}-win-x64.zip"
          Compress-Archive -Path bin/Ayr.exe, bin/ayrctl.exe -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Set-Content "$zip.sha256"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Ayr-${{ steps.version.outputs.number }}-win-x64.zip"
          gh release create "${{ github.ref_name }}" $zip "$zip.sha256" --title "Ayr ${{ steps.version.outputs.number }}" --generate-notes
